<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27364f"/>
      <stop offset="0.45" stop-color="#b8656a"/>
      <stop offset="0.8" stop-color="#f3b871"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6a78"/><stop offset="1" stop-color="#5d5468"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c7a45"/><stop offset="1" stop-color="#5f6a35"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7f33"/><stop offset="1" stop-color="#34451f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1418" stop-opacity="0.82"/><stop offset="1" stop-color="#1c1418" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e4"/><stop offset="1" stop-color="#eedfc2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d477"/><stop offset="1" stop-color="#c8962e"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e2440"/><stop offset="1" stop-color="#5c1429"/>
    </linearGradient>
    <pattern id="rowsRipe" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="26" height="26" fill="#6b5a26"/><rect width="26" height="13" fill="#c9a23a"/>
    </pattern>
    <pattern id="rowsGreen" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <rect width="26" height="26" fill="#3f5a22"/><rect width="26" height="13" fill="#7d9a3a"/>
    </pattern>
    <pattern id="rowsRed" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <rect width="26" height="26" fill="#6a3320"/><rect width="26" height="13" fill="#b5562e"/>
    </pattern>
    <pattern id="fallow" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#7a6a4a"/><circle cx="5" cy="6" r="1.6" fill="#93825c"/><circle cx="13" cy="13" r="1.6" fill="#93825c"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bühne: Himmel, Sonne, Hügel -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1380" cy="420" r="260" fill="url(#sun)"/>
  <circle cx="1380" cy="420" r="58" fill="#fff0bd"/>
  <g fill="#fff" opacity="0.28">
    <ellipse cx="420" cy="210" rx="210" ry="26"/><ellipse cx="560" cy="236" rx="150" ry="18"/>
    <ellipse cx="1650" cy="250" rx="170" ry="20"/>
  </g>
  <path d="M0 520 C260 420 520 470 760 440 C1040 400 1300 470 1560 430 C1720 410 1840 440 1920 430 L1920 1080 L0 1080 Z" fill="url(#hillFar)"/>
  <path d="M0 640 C300 540 640 600 900 560 C1200 510 1500 600 1920 540 L1920 1080 L0 1080 Z" fill="url(#hillMid)"/>
  <!-- Fluss -->
  <path d="M0 700 C300 660 520 720 820 690 C1100 660 1400 720 1920 670 L1920 730 C1400 780 1100 720 820 750 C520 780 300 720 0 760 Z" fill="#c9d7e6" opacity="0.55"/>
  <path d="M0 760 C360 700 760 780 1120 730 C1460 690 1700 740 1920 720 L1920 1080 L0 1080 Z" fill="url(#hillNear)"/>

  <!-- Parzellen als anklickbare Flächen -->
  <g stroke="#1c1418" stroke-opacity="0.45" stroke-width="3">
    <path d="M250 590 L560 548 L640 660 L300 700 Z" fill="url(#rowsRipe)"/>
    <path d="M700 548 L960 520 L1040 630 L760 664 Z" fill="url(#rowsGreen)"/>
    <path d="M1160 560 L1420 570 L1460 668 L1180 660 Z" fill="url(#rowsRed)"/>
    <path d="M1540 600 L1760 584 L1800 676 L1560 690 Z" fill="url(#fallow)"/>
  </g>
  <!-- Auswahlrahmen der reifen Parzelle -->
  <path d="M250 590 L560 548 L640 660 L300 700 Z" fill="none" stroke="#f6d477" stroke-width="6" stroke-dasharray="18 10"/>

  <!-- Parzellenschilder -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="20">
    <g filter="url(#soft)">
      <rect x="330" y="486" width="336" height="74" rx="12" fill="url(#card)"/>
      <text x="348" y="516" font-weight="700" fill="#3a1d24">Hauslage · Riesling</text>
      <text x="348" y="544" fill="#6a4a2a">4 ha · 86 °Oe · Spätlese möglich</text>
      <circle cx="640" cy="512" r="13" fill="#b3261e"/><text x="640" y="519" text-anchor="middle" fill="#fff" font-weight="700" font-size="17">!</text>
    </g>
    <g filter="url(#soft)">
      <rect x="760" y="462" width="262" height="50" rx="12" fill="#1c1418" fill-opacity="0.72"/>
      <text x="778" y="494" fill="#f4ead7">Südhang · Silvaner · 71 °Oe</text>
    </g>
    <g filter="url(#soft)">
      <rect x="1196" y="502" width="326" height="50" rx="12" fill="#1c1418" fill-opacity="0.72"/>
      <text x="1214" y="534" fill="#f4ead7">Talweg · Spätburgunder · 2. Jahr</text>
    </g>
    <g filter="url(#soft)">
      <rect x="1572" y="528" width="210" height="50" rx="12" fill="#1c1418" fill-opacity="0.72"/>
      <text x="1590" y="560" fill="#f4ead7">Neuland · Brache</text>
    </g>
  </g>

  <!-- Gebäude: Gutshaus, Kelterhaus, Vinothek -->
  <g filter="url(#soft)">
    <rect x="560" y="752" width="250" height="150" fill="#efe1c6"/>
    <path d="M540 756 L685 668 L830 756 Z" fill="#8a3b2c"/>
    <rect x="660" y="826" width="50" height="76" rx="24" fill="#5c1429"/>
    <g fill="#3a4c66"><rect x="590" y="790" width="40" height="46"/><rect x="740" y="790" width="40" height="46"/></g>
    <rect x="850" y="792" width="210" height="110" fill="#d9c7a3"/>
    <path d="M836 796 L955 730 L1074 796 Z" fill="#6f4a36"/>
    <path d="M905 902 L905 846 A50 50 0 0 1 1005 846 L1005 902 Z" fill="#3a2a22"/>
    <rect x="1110" y="812" width="230" height="90" fill="#f4ead7"/>
    <rect x="1098" y="796" width="254" height="22" fill="#5c1429"/>
    <g fill="#9cc0d8"><rect x="1128" y="834" width="56" height="50"/><rect x="1198" y="834" width="56" height="50"/><rect x="1268" y="834" width="56" height="50"/></g>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#f4ead7" text-anchor="middle">
    <g><rect x="620" y="914" width="130" height="34" rx="17" fill="#1c1418" fill-opacity="0.72"/><text x="685" y="938">Kontor</text></g>
    <g><rect x="890" y="914" width="130" height="34" rx="17" fill="#1c1418" fill-opacity="0.72"/><text x="955" y="938">Keller</text><circle cx="1014" cy="918" r="13" fill="#b3261e"/><text x="1014" y="925" font-weight="700" font-size="16">2</text></g>
    <g><rect x="1160" y="914" width="130" height="34" rx="17" fill="#1c1418" fill-opacity="0.72"/><text x="1225" y="938">Vinothek</text></g>
  </g>

  <!-- Kopfzeile -->
  <rect x="0" y="0" width="1920" height="92" fill="url(#glass)"/>
  <!-- Jahresrad -->
  <g transform="translate(62 46)">
    <circle r="32" fill="none" stroke="#f4ead7" stroke-opacity="0.25" stroke-width="10"/>
    <circle r="32" fill="none" stroke="url(#gold)" stroke-width="10" stroke-dasharray="167.5 201" transform="rotate(-90)"/>
    <text y="8" text-anchor="middle" fill="#f4ead7" font-size="22" font-weight="700">10</text>
  </g>
  <text x="112" y="42" fill="#f4ead7" font-size="30" font-weight="700">Oktober · Jahr 4</text>
  <text x="112" y="72" fill="#d9c7a3" font-size="19" font-family="'Segoe UI', Arial, sans-serif">Weingut Sonnenhang · Mosel</text>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <g transform="translate(560 20)">
      <rect width="230" height="52" rx="26" fill="#f4ead7" fill-opacity="0.12" stroke="#f4ead7" stroke-opacity="0.25"/>
      <circle cx="28" cy="26" r="15" fill="url(#gold)"/><text x="28" y="33" text-anchor="middle" font-size="19" font-weight="700" fill="#3a1d24">€</text>
      <text x="56" y="34" fill="#f4ead7" font-size="24" font-weight="600">42.380 €</text>
    </g>
    <g transform="translate(806 20)">
      <rect width="230" height="52" rx="26" fill="#f4ead7" fill-opacity="0.12" stroke="#f4ead7" stroke-opacity="0.25"/>
      <path d="M18 14 h20 v8 a10 10 0 0 1 -20 0 Z M25 32 h6 v6 h-6 Z" fill="url(#gold)"/>
      <text x="56" y="34" fill="#f4ead7" font-size="24" font-weight="600">187 / 600</text>
      <rect x="56" y="42" width="150" height="4" rx="2" fill="#f4ead7" fill-opacity="0.2"/><rect x="56" y="42" width="47" height="4" rx="2" fill="url(#gold)"/>
    </g>
    <g transform="translate(1052 20)">
      <rect width="170" height="52" rx="26" fill="#f4ead7" fill-opacity="0.12" stroke="#f4ead7" stroke-opacity="0.25"/>
      <path d="M28 12 l4.5 9.5 10.5 1.3 -7.7 7.2 2 10.3 -9.3 -5.1 -9.3 5.1 2 -10.3 -7.7 -7.2 10.5 -1.3 Z" fill="url(#gold)"/>
      <text x="56" y="34" fill="#f4ead7" font-size="24" font-weight="600">34</text>
      <text x="92" y="34" fill="#d9c7a3" font-size="17">bekannt</text>
    </g>

    <!-- Wettervorschau: drei Monate als Karten -->
    <g transform="translate(1262 14)" font-size="16" fill="#f4ead7">
      <g>
        <rect width="142" height="64" rx="12" fill="#f4ead7" fill-opacity="0.18" stroke="url(#gold)" stroke-width="2"/>
        <circle cx="26" cy="32" r="12" fill="#ffd27a"/>
        <text x="48" y="28" font-weight="700">Okt</text><text x="48" y="48">60 % sonnig</text>
      </g>
      <g transform="translate(150 0)">
        <rect width="142" height="64" rx="12" fill="#f4ead7" fill-opacity="0.1"/>
        <ellipse cx="26" cy="30" rx="15" ry="9" fill="#c9d7e6"/><path d="M18 44 l-3 8 M27 44 l-3 8 M36 44 l-3 8" stroke="#9cc0d8" stroke-width="3"/>
        <text x="48" y="28" font-weight="700">Nov</text><text x="48" y="48">45 % nass</text>
      </g>
      <g transform="translate(300 0)">
        <rect width="142" height="64" rx="12" fill="#f4ead7" fill-opacity="0.1"/>
        <path d="M26 18 v28 M14 25 l24 14 M38 25 l-24 14" stroke="#dff1ff" stroke-width="3"/>
        <text x="48" y="28" font-weight="700">Dez</text><text x="48" y="48">44 % Frost</text>
      </g>
    </g>
    <g transform="translate(1722 22)" fill="#f4ead7" font-size="18" text-anchor="middle">
      <rect width="52" height="48" rx="12" fill="#f4ead7" fill-opacity="0.12"/><text x="26" y="31" font-weight="700">?</text>
      <rect x="62" width="52" height="48" rx="12" fill="#f4ead7" fill-opacity="0.12"/><path d="M78 20 h8 l10 -8 v24 l-10 -8 h-8 Z" fill="#f4ead7"/>
      <rect x="124" width="52" height="48" rx="12" fill="#f4ead7" fill-opacity="0.12"/><path d="M138 16 h24 M138 24 h24 M138 32 h24" stroke="#f4ead7" stroke-width="3"/>
    </g>
  </g>

  <!-- Linke Navigationsleiste -->
  <rect x="0" y="92" width="112" height="988" fill="url(#glass)"/>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#d9c7a3">
    <g transform="translate(56 170)">
      <circle r="36" fill="url(#gold)"/><path d="M-18 6 L0 -14 L18 6 V18 H-18 Z" fill="#3a1d24"/>
      <text y="62" fill="#f6d477" font-weight="700">Gut</text>
    </g>
    <g transform="translate(56 300)">
      <circle r="36" fill="#f4ead7" fill-opacity="0.12"/><circle cx="-8" cy="-4" r="7" fill="#d9c7a3"/><circle cx="8" cy="-4" r="7" fill="#d9c7a3"/><circle cy="9" r="7" fill="#d9c7a3"/>
      <text y="62">Weinberg</text><circle cx="28" cy="-28" r="14" fill="#b3261e"/><text x="28" y="-22" fill="#fff" font-weight="700">1</text>
    </g>
    <g transform="translate(56 430)">
      <circle r="36" fill="#f4ead7" fill-opacity="0.12"/><ellipse rx="18" ry="13" fill="none" stroke="#d9c7a3" stroke-width="4"/><path d="M-18 0 H18" stroke="#d9c7a3" stroke-width="4"/>
      <text y="62">Keller</text><circle cx="28" cy="-28" r="14" fill="#b3261e"/><text x="28" y="-22" fill="#fff" font-weight="700">2</text>
    </g>
    <g transform="translate(56 560)">
      <circle r="36" fill="#f4ead7" fill-opacity="0.12"/><path d="M-16 -8 H16 L12 14 H-12 Z M-8 -8 a8 8 0 0 1 16 0" fill="none" stroke="#d9c7a3" stroke-width="4"/>
      <text y="62">Markt</text><circle cx="28" cy="-28" r="14" fill="#b3261e"/><text x="28" y="-22" fill="#fff" font-weight="700">1</text>
    </g>
    <g transform="translate(56 690)">
      <circle r="36" fill="#f4ead7" fill-opacity="0.12"/><path d="M-14 -14 H14 V14 H-14 Z M-7 -5 H7 M-7 3 H7" fill="none" stroke="#d9c7a3" stroke-width="4"/>
      <text y="62">Kontor</text>
    </g>
    <g transform="translate(56 820)">
      <circle r="36" fill="#f4ead7" fill-opacity="0.12"/><circle cx="-9" cy="-5" r="7" fill="#d9c7a3"/><circle cx="9" cy="-5" r="7" fill="#d9c7a3"/><path d="M-20 16 a11 11 0 0 1 22 0 M-2 16 a11 11 0 0 1 22 0" fill="#d9c7a3"/>
      <text y="62">Dorf</text>
    </g>
  </g>

  <!-- Neuigkeiten rechts: fester Platz, blättern statt scrollen -->
  <g filter="url(#soft)" font-family="'Segoe UI', Arial, sans-serif">
    <rect x="1500" y="116" width="396" height="232" rx="18" fill="url(#glass)"/>
    <text x="1524" y="154" fill="#f6d477" font-size="22" font-weight="700" font-family="Georgia, serif">Neuigkeiten</text>
    <g font-size="18" fill="#f4ead7">
      <circle cx="1534" cy="188" r="6" fill="#7dbb6a"/><text x="1552" y="194">Weinführer empfiehlt dein Gut (+3)</text>
      <circle cx="1534" cy="226" r="6" fill="#e0884c"/><text x="1552" y="232">Kirschessigfliege im Talweg</text>
      <circle cx="1534" cy="264" r="6" fill="#f6d477"/><text x="1552" y="270">Riesling-Trend steigt auf 118 %</text>
    </g>
    <g transform="translate(1524 300)" font-size="16" fill="#d9c7a3">
      <text y="22">Seite 1 von 3</text>
      <g transform="translate(290 0)"><rect width="36" height="32" rx="8" fill="#f4ead7" fill-opacity="0.12"/><path d="M22 8 l-9 8 9 8" fill="none" stroke="#f4ead7" stroke-width="3"/></g>
      <g transform="translate(332 0)"><rect width="36" height="32" rx="8" fill="#f4ead7" fill-opacity="0.12"/><path d="M14 8 l9 8 -9 8" fill="none" stroke="#f4ead7" stroke-width="3"/></g>
    </g>
  </g>

  <!-- Aufgabenkarten "Diesen Monat" -->
  <g font-family="'Segoe UI', Arial, sans-serif" filter="url(#soft)">
    <g transform="translate(136 968)">
      <rect width="318" height="96" rx="16" fill="url(#card)"/><rect width="10" height="96" rx="5" fill="#b3261e"/>
      <text x="28" y="34" font-size="20" font-weight="700" fill="#3a1d24">Lese: Hauslage ist reif</text>
      <text x="28" y="60" font-size="17" fill="#6a4a2a">86 °Oe · Regen droht im November</text>
      <text x="28" y="84" font-size="16" font-weight="700" fill="#8e2440">Zum Weinberg ›</text>
    </g>
    <g transform="translate(470 968)">
      <rect width="318" height="96" rx="16" fill="url(#card)"/><rect width="10" height="96" rx="5" fill="#b3261e"/>
      <text x="28" y="34" font-size="20" font-weight="700" fill="#3a1d24">Abfüllen: 2 Weine bereit</text>
      <text x="28" y="60" font-size="17" fill="#6a4a2a">Silvaner Kabinett, Riesling QbA</text>
      <text x="28" y="84" font-size="16" font-weight="700" fill="#8e2440">Zum Keller ›</text>
    </g>
    <g transform="translate(804 968)">
      <rect width="318" height="96" rx="16" fill="url(#card)"/><rect width="10" height="96" rx="5" fill="#c8962e"/>
      <text x="28" y="34" font-size="20" font-weight="700" fill="#3a1d24">Exportanfrage aus Japan</text>
      <text x="28" y="60" font-size="17" fill="#6a4a2a">600 Fl./Monat · nur diesen Monat</text>
      <text x="28" y="84" font-size="16" font-weight="700" fill="#8e2440">Zum Markt ›</text>
    </g>
    <g transform="translate(1138 968)">
      <rect width="318" height="96" rx="16" fill="url(#card)"/><rect width="10" height="96" rx="5" fill="#7d9a3a"/>
      <text x="28" y="34" font-size="20" font-weight="700" fill="#3a1d24">Große Rebenkrone</text>
      <text x="28" y="60" font-size="17" fill="#6a4a2a">Im November: 3 Weine melden</text>
      <text x="28" y="84" font-size="16" font-weight="700" fill="#8e2440">Zum Markt ›</text>
    </g>
  </g>

  <!-- Zug beenden -->
  <g font-family="'Segoe UI', Arial, sans-serif" filter="url(#soft)">
    <g transform="translate(1486 968)">
      <rect width="96" height="96" rx="18" fill="#1c1418" fill-opacity="0.8" stroke="#f4ead7" stroke-opacity="0.3"/>
      <path d="M26 30 l22 18 -22 18 Z M48 30 l22 18 -22 18 Z" fill="#f4ead7"/>
      <text x="48" y="88" text-anchor="middle" font-size="14" fill="#d9c7a3">Vorspulen</text>
    </g>
    <g transform="translate(1598 968)">
      <rect width="298" height="96" rx="18" fill="url(#wine)" stroke="url(#gold)" stroke-width="3"/>
      <text x="149" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#fff6e6" font-family="Georgia, serif">Monat beenden</text>
      <text x="149" y="74" text-anchor="middle" font-size="16" fill="#f0cfd6">weiter in den November · Leertaste</text>
    </g>
  </g>
</svg>
