name: Release

# Ein Versions-Tag (v0.3.0) ist die Freigabe: baut die Desktop-App für x64 und ARM64 als ZIP und als Installer
# und legt einen Release-Entwurf an. Von Hand gestartet entstehen nur Artefakte zum Testen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }
      - name: Testen, veröffentlichen, packen
        shell: pwsh
        run: ./installer/build.ps1
      - name: Installer müssen entstanden sein
        shell: pwsh
        run: |
          $setups = Get-ChildItem artifacts/*-setup.exe
          if ($setups.Count -lt 2) { throw "Erwartet: zwei Installer, gefunden: $($setups.Count)" }
      - uses: actions/upload-artifact@v7
        with:
          name: WinzerAI
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: WinzerAI
      - name: Release-Entwurf anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" WinzerAI-*.zip WinzerAI-*-setup.exe --clobber
