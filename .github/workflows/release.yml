name: Release

# Ein Versions-Tag (v0.3.0) ist die Freigabe: baut die Desktop-App für x64 und ARM64 und legt einen Release-Entwurf an.
# Von Hand gestartet entstehen nur Artefakte zum Testen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      - name: Tests
        run: dotnet test Winzer.slnx -c Release
      - name: Veröffentlichen
        run: >
          dotnet publish src/Winzer.Desktop -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}
      - name: Packen
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WinzerAI-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: WinzerAI-${{ matrix.rid }}
          path: WinzerAI-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Release-Entwurf anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" WinzerAI-*.zip --clobber
